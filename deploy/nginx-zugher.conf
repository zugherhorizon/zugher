# /etc/nginx/sites-available/zugher
# After copy: sudo ln -s /etc/nginx/sites-available/zugher /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d zugher.fr -d www.zugher.fr

server {
    listen 80;
    listen [::]:80;
    server_name zugher.fr www.zugher.fr;

    client_max_body_size 25M;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache long pour assets immuables servis par TanStack/Vite
    location /_build/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
